<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h1>⏱️ Countdown Timer</h1>

        <div class="quick-set">
            <button class="quick-btn" onclick="quickSet(1,0,0)">1 Min</button>
            <button class="quick-btn" onclick="quickSet(5, 0,0)">5 Min</button>
            <button class="quick-btn" onclick="quickSet(10,0,0)">10 Min</button>
            <button class="quick-btn" onclick="quickSet(25,0,0)">25 Min</button>
            <button class="quick-btn" onclick="quickSet(0,1,0)">1 Hr</button>

        </div>
        <div class="input-section">
            <div class="input-group">
                <label>Hours</label>
                <input type="number" id="hours" min="0" max="23" value="0">
            </div>

            <div class="input-group">
                <label>Minutes</label>
                <input type="number" id="minutes" min="0" max="59" value="5">
            </div>
            
            <div class="input-group">
                <label>Seconds</label>
                <input type="number" id="seconds" min="0" max="59" value="0">
            </div>
        </div>
        <div class="controls">
            <button class="start-btn" onclick="startTimer()">Start</button>
            <button class="pause-btn" onclick="pauseTimer()">Pause</button>
            <button class="reset-btn" onclick="resetTimer()">Reset</button>
        </div>

        <div class="display">
            <div class="time-display" id="timeDisplay">00:05:00</div>
            <div class="labels">
                <span class="label">Hours</span>
                <span class="label">Minutes</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div class="status" id="status">Ready to start</div>
    </div>

    <script src="ind.js"></script>
</body>
</html>
